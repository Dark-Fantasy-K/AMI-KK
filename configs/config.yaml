dataset:
  name: FRED
  root: /data/FRED
  input_size: 640          # model input (square)
  event_bins: 5            # voxel grid time bins
  fusion_mode: late        # "early" | "late"
  num_classes: 1           # drone only
  class_names: [drone]

model:
  pretrained: true
  checkpoint: null         # path to resume from

training:
  epochs: 50
  batch_size: 8
  num_workers: 4
  lr: 0.001
  weight_decay: 0.0005
  lr_warmup_epochs: 3
  cosine_decay: true
  conf_threshold: 0.3
  iou_threshold: 0.45
  save_dir: /data/checkpoints

anchors:
  # (w, h) in pixels at 640x640 input — 3 scales × 3 anchors
  small:  [[10,13], [16,30], [33,23]]
  medium: [[30,61], [62,45], [59,119]]
  large:  [[116,90], [156,198], [200,180]]

inference:
  conf_threshold: 0.4
  iou_threshold: 0.45
  checkpoint: /data/checkpoints/best.pt

webapp:
  host: 0.0.0.0
  port: 8000
  max_upload_mb: 50
